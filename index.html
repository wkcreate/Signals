<style>

.live{font-size:11px;color:var(--mut);white-space:nowrap}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:9px;background:var(--up);margin-right:5px}.live.d:before{background:var(--wt)}

.tl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 10px}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform .22s;padding:env(safe-area-inset-top,0) 0 calc(20px + env(safe-area-inset-bottom,0))}.sheet.open{transform:none}
.sh{max-width:760px;margin:0 auto;padding:12px 16px}.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dh b{font-size:19px}.px{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
#dtf{display:flex;gap:6px;margin:12px 0 0}#cvs{height:330px;margin:8px 0 4px}
table.lv th{position:static;cursor:default}table.lv td,table.lv th{text-align:right}table.lv td:first-child,table.lv th:first-child{text-align:left;font-weight:650}table.lv td{opacity:.5}table.lv tr.on td{opacity:1;background:var(--hl)}
.ch{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.ch span{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:2px 8px;font-size:11px;color:var(--mut)}.ch b{color:var(--tx);font-weight:600}
.fr{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:8px;font-size:12px;margin:4px 0}.tr{position:relative;height:6px;background:var(--ln);border-radius:9px}.tr i{position:absolute;top:0;height:100%;border-radius:9px}.tr:after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--mut)}
ul{margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--mut)}li{margin:3px 0}
#lk{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}#lk>div{max-width:340px;width:100%;text-align:center}#lk input{width:100%;margin:14px 0 8px;text-align:center}
@media(max-width:700px){.hm{display:none}}
@media(min-width:900px){body{padding-bottom:20px}.tabs{position:static;max-width:520px;margin:0 auto 4px;border:1px solid var(--ln);border-radius:16px}}
</style></head><body>
<div class="top"><b>◆ Сигналы</b><div class="mk" id="mk"></div><span class="live" id="mode"></span></div>
<div id="bn"></div>
<nav class="tabs" id="tabs"></nav>
<main>
<section id="v-ideas"></section>
<section id="v-mkt"><div class="tl"><input id="q" placeholder="Поиск пары" oninput="Q=this.value.toUpperCase();render()"><span id="fl" style="display:contents"></span></div><div class="tb" style="max-height:calc(100vh - 230px)"><table><thead id="th"></thead><tbody id="tbd"></tbody></table></div></section>

</main>
<aside class="sheet" id="sheet"><div class="sh"><div id="dh"></div><div id="dtf"></div><div id="cvs"></div><div class="mut" id="lg"></div><div id="di"></div></div></aside>
<div id="lk"><div><h2 style="justify-content:center">Введите пароль</h2><div class="mut">Данные зашифрованы. Пароль задаётся при настройке (PAGES_PASSWORD) и хранится только на этом устройстве.</div><input id="pw" type="password" placeholder="Пароль" onkeydown="if(event.key=='Enter')unlock()"><button class="on" onclick="unlock()">Открыть</button><div class="mut" id="lke" style="margin-top:8px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=i=>document.getElementById(i),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fx=x=>x>=100?x.toLocaleString("en-US",{maximumFractionDigits:2}):x>=1?x.toFixed(4):x.toFixed(6),pc=(a,b)=>(a/b-1)*100,sg=v=>(v>0?"+":"")+v.toFixed(2);
let ST=null,STS=null,MODE="demo",VW="ideas",F="all",Q="",SK="conf",SD=-1,SEL=null,TF=null,SIG="",JP=null,PW="",ENC=null,CH=null,CI=0,CT=0,FV=new Set();
try{FV=new Set(JSON.parse(localStorage.getItem("fav")||"[]"));PW=localStorage.getItem("pw")||""}catch(e){}
function fav(s){FV.has(s)?FV.delete(s):FV.add(s);try{localStorage.setItem("fav",JSON.stringify([...FV]))}catch(e){}render()}
const cls=s=>s.side>0?"long":s.side<0?"short":"wait",lab=s=>s.side>0?"ЛОНГ":s.side<0?"ШОРТ":"ЖДАТЬ",col=s=>s.side>0?"up":s.side<0?"dn":"wt",bs=s=>s.replace("USDT",""),PS=y=>STS&&STS.per&&STS.per[y],pairs=()=>ST.pairs.filter(s=>!s.error);
const IC={ideas:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',mkt:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',fav:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',stats:'<path d="M3 17l5-6 4 3 8-9M3 21h18"/>'};
const TB=()=>VW=="mkt"&&F=="fav"?"fav":VW;
function go(t){if(t=="fav"){VW="mkt";F="fav"}else{VW=t;if(t=="mkt"&&F=="fav")F="all"}JP=null;closeD();render();scrollTo(0,0)}
function ring(v,c){return `<svg width="46" height="46" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--ln)" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="var(--${c})" stroke-width="4" stroke-linecap="round" stroke-dasharray="${v*1.131} 113.1" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${v}</text></svg>`}
function pst(y){const p=PS(y);if(!p||!p.closed)return `<span class="mut">история пары: пока нет</span>`;const bad=p.closed>=20&&p.avg_R<0;return `<span class="${bad?"dn":"mut"}">${bad?"⚠ ":""}история пары: ${p.closed} закр. · ${p.winrate}% · ${sg(p.total_R)}R</span>`}
function idea(s){const a=s.side>0?s.lv.long:s.lv.short,e=s.entry||s.price;
return `<div class="idea ${s.capped?"cap":""}" onclick="openD('${s.symbol}')"><div class="ih"><div><b class="sy">${esc(bs(s.symbol))}</b> <span class="mut">/USDT · ${esc(s.tf)}</span><br><span class="bd ${cls(s)}">${lab(s)}</span> <span class="mut">${s.capped?"в очереди (лимит)":s.mode=="limit"?"лимитный вход":"по рынку"}</span></div>${ring(s.conf,col(s))}</div>
<div class="lv4">${[["Вход",e],["Стоп",a[0]],["TP1",a[1]],["TP2",a[2]]].map(([t,p])=>`<div><i>${t}</i>${fx(p)}<small class="${t=="Стоп"?"dn":t.startsWith("TP")?"up":"mut"}">${t=="Вход"?"":sg(pc(p,e))+"%"}</small></div>`).join("")}</div>
<div class="mut">удержание ${s.hold} · актуален ${s.expire} · R:R 1:1.5</div><div style="margin-top:3px">${pst(s.symbol)}</div></div>`}
function renderIdeas(){const a=pairs().filter(s=>s.side).sort((x,y)=>(x.capped-y.capped)||y.conf-x.conf),on=a.filter(s=>!s.capped),q=a.filter(s=>s.capped),f=pairs().filter(s=>FV.has(s.symbol)&&!s.side);
$("v-ideas").innerHTML=`<h2>Активные идеи <span class="mut">${on.length}</span></h2>`+(on.length?`<div class="grid">${on.map(idea).join("")}</div>`:`<div class="empty box">Сейчас нет сигналов: рынок без чёткого преимущества. Это нормальное состояние — лучше подождать, чем входить без повода.</div>`)
+(q.length?`<h2>В очереди <span class="mut">${q.length} · вне лимита одновременных сигналов</span></h2><div class="grid">${q.slice(0,12).map(idea).join("")}</div>`:"")
+(f.length?`<h2>Избранное без сигнала <span class="mut">${f.length}</span></h2><div class="tb"><table>${f.map(s=>`<tr class="r" onclick="openD('${s.symbol}')"><td><span class="st">★</span></td><td><b>${esc(bs(s.symbol))}</b></td><td>${fx(s.price)}</td><td><span class="bd wait">ЖДАТЬ</span></td></tr>`).join("")}</table></div>`:"")}
const V={symbol:s=>s.symbol,price:s=>s.price,side:s=>s.side*s.conf,conf:s=>s.conf,rsi:s=>s.ind.rsi,adx:s=>s.ind.adx,funding:s=>s.funding==null?-9:s.funding};
const COLS=[["★",null,s=>`<span class="st" onclick="event.stopPropagation();fav('${s.symbol}')">${FV.has(s.symbol)?"★":"☆"}</span>`],["Пара","symbol",s=>`<b>${esc(bs(s.symbol))}</b> <span class="mut">${esc(s.tf)}</span>`],["Цена","price",s=>fx(s.price)],
["Сигнал","side",s=>`<span class="bd ${cls(s)}">${lab(s)}</span>`],["Увер.","conf",s=>s.conf+"%"],["RSI","rsi",s=>s.ind.rsi.toFixed(0),1],["ADX","adx",s=>s.ind.adx.toFixed(0),1],["Fund %","funding",s=>s.funding==null?"—":(s.funding*100).toFixed(3),1]];
function rows(){const k={all:()=>1,fav:s=>FV.has(s.symbol),long:s=>s.side>0,short:s=>s.side<0,wait:s=>s.side===0},g=V[SK];
return pairs().filter(s=>Q?s.symbol.includes(Q):k[F](s)).sort((a,b)=>((SK=="conf"&&SD<0)?FV.has(b.symbol)-FV.has(a.symbol):0)||(typeof g(a)=="string"?g(a).localeCompare(g(b)):g(a)-g(b))*SD)}
function sortBy(k){if(SK==k)SD=-SD;else{SK=k;SD=k=="symbol"?1:-1}render()}
function renderMkt(){const a=rows();
$("fl").innerHTML=[["all","Все"],["long","Лонг"],["short","Шорт"],["wait","Ждать"],["fav","★"]].map(([k,t])=>`<button class="${F==k?"on":""}" onclick="F='${k}';render()">${t}</button>`).join("")+`<span class="mut">${a.length}</span>`;
$("th").innerHTML="<tr>"+COLS.map(([t,k,,h])=>`<th class="${h?"hm":""}" ${k?`onclick="sortBy('${k}')"`:""}>${t}${k==SK?(SD<0?" ↓":" ↑"):""}</th>`).join("")+"</tr>";
$("tbd").innerHTML=a.slice(0,400).map(s=>`<tr class="r" onclick="openD('${s.symbol}')">${COLS.map(([,,f,h])=>`<td class="${h?"hm":""}">${f(s)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="8" class="mut" style="text-align:center;padding:24px">Ничего не найдено</td></tr>`}
// ---------- Статистика: общая и по каждой паре ----------
const JL={SL:["✗ стоп","dn"],TP1:["✓ тейк","up"],open:["● в позиции","wt"],waiting:["⏳ ждёт входа","mut"],nofill:["— не исполнен","mut"],nodata:["нет данных","mut"]};
function pickJ(v){const per=(STS&&STS.per)||{},u=v.trim().toUpperCase(),k=Object.keys(per).find(x=>x==u||bs(x)==u);JP=k||null;render()}
function kpis(S){const N=v=>v==null?"—":v,k=(t,v,c)=>`<div class="kp"><div class="mut">${t}</div><div class="kv ${c||""}">${v}</div></div>`;
return `<div class="kg">${k("Сигналов",S.n)}${k("Закрыто",`${S.closed} <span class="mut">✓${S.wins} ✗${S.closed-S.wins}</span>`)}${k("Винрейт",S.winrate==null?"—":`${S.winrate}%<div class="mut">95%: ${S.ci[0]}–${S.ci[1]}% · безубыток ${S.be_winrate}%</div>`)}${k("Итог",sg(S.total_R)+"R",S.total_R>=0?"up":"dn")}${k("Средний R",N(S.avg_R))}${k("Profit factor",N(S.profit_factor))}${k("Макс. просадка",S.max_dd_R+"R")}${k("Лимитки исполнены",N(S.fill_rate)+(S.fill_rate==null?"":"%"))}${k("TP2 достигнут",N(S.tp2_rate)+(S.tp2_rate==null?"":"%"))}${k("В позиции / ждут",`${S.open} / ${S.waiting}`)}</div>`}
function eqSvg(eq){if(!eq||eq.length<2)return `<p class="mut">Кривая появится после первых закрытых сделок.</p>`;const mx=Math.max(...eq,0),mn=Math.min(...eq,0),H=120,y=v=>H-4-(v-mn)/(mx-mn||1)*(H-8);
return `<svg viewBox="0 0 600 ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px"><line x1="0" x2="600" y1="${y(0)}" y2="${y(0)}" stroke="var(--ln)"/><polyline fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke" points="${eq.map((v,i)=>(i/(eq.length-1)*600)+","+y(v)).join(" ")}"/></svg>`}
let ZK="total_R";
function renderStats(){const el=$("v-stats");if(document.activeElement&&document.activeElement.id=="sp")return;
if(!STS){el.innerHTML='<p class="mut pad">Журнал пока пуст: сигналы записываются автоматически и появятся здесь после первого срабатывания.</p>';return}
const per=STS.per||{},rows=STS.rows||[],S=JP?per[JP]:STS.stats,rw=JP?rows.filter(r=>r.symbol==JP):rows,g=o=>Object.entries(o).map(([a,b])=>`<tr><td>${a}</td><td>${b.n}</td><td>${b.winrate==null?"—":b.winrate+"%"}</td><td>${b.avg_R==null?"—":sg(b.avg_R)+"R"}</td></tr>`).join("");
const dt=t=>new Date(t*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const sy=Object.entries(per).filter(([,p])=>p.n).sort((a,b)=>(b[1][ZK]??-99)-(a[1][ZK]??-99)).slice(0,300);
el.innerHTML=`<div class="sp"><input id="sp" list="dl" placeholder="Статистика по паре: BTC, ETH…" value="${JP?esc(bs(JP)):""}" onchange="pickJ(this.value)"><datalist id="dl">${Object.keys(per).sort().map(k=>`<option value="${bs(k)}">`).join("")}</datalist>${JP?`<button onclick="JP=null;render()">← Все пары</button>`:""}</div>
<h2>${JP?esc(bs(JP))+"/USDT — статистика пары":"Общая статистика"}</h2>
<div class="box" style="padding:10px 12px"><b>Вывод:</b> ${esc(S.verdict)}.<div class="mut">Лимитка считается исполненной, только если цена дошла до входа за срок актуальности. Если в одной свече коснулись и стопа, и тейка — засчитывается стоп. R — с комиссиями.</div></div>
${kpis(S)}<h2>Кривая результата (R)</h2><div class="box">${eqSvg(S.equity)}</div>
${JP?"":`<h2>По парам <span class="mut">нажми на пару</span></h2><div class="sp" style="margin:0 0 8px">${[["total_R","по итогу R"],["winrate","по винрейту"],["closed","по числу сделок"]].map(([k,t])=>`<button class="${ZK==k?"on":""}" onclick="ZK='${k}';render()">${t}</button>`).join("")}</div>

async function dec(e,pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);

return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text())}
